<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capstone Registration</title>
</head>
<body>
    <header>
        <h1>Capstone Registration</h1>
        <a href="login.html">Logout</a>
         <link rel="stylesheet" href="../CSS/style.css">
    </header>

    <div style="display: flex;">
        <aside>
            <nav>
                <ul>
                    <li><a href="studentdashboard.html">Dashboard</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="registration.html">Registration</a></li>
                    <li><a href="project.html">My Project</a></li>
                    <li><a href="group.html">My Group</a></li>
                    <li><a href="supervisor.html">My Supervisor</a></li>
                    <li><a href="assessments.html">My Assessments</a></li>
                    <li><a href="notifications.html">Notifications</a></li>
                </ul>
            </nav>
        </aside>

        <main>
            <h2>Submit Project Proposal</h2>
            <form action="#" method="POST">
                <div>
                    <label for="project-title">Proposed Title:</label>
                    <input type="text" id="project-title" name="project-title" required>
                </div>

                <div>
                    <label for="domain">Project Domain/Category:</label>
                    <select id="domain" name="domain">
                        <option value="web">Web Development</option>
                        <option value="mobile">Mobile Applications</option>
                        <option value="ai">Machine Learning / AI</option>
                        <option value="cybersecurity">Cybersecurity</option>
                    </select>
                </div>

                <div>
                    <label for="description">Problem Statement & Description:</label>
                    <textarea id="description" name="description" rows="5" required></textarea>
                </div>

                <div>
                    <button type="submit">Submit Registration</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
