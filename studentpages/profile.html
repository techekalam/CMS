<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
     <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <header>
        <h1>Student Profile</h1>
        <a href="login.html">Logout</a>
    </header>

    <div style="display: flex;">
        <aside>
            <nav>
                <ul>
                    <li><a href="studentdashboard.html">Dashboard</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="registration.html">Registration</a></li>
                    <li><a href="project.html">My Project</a></li>
                    <li><a href="group.html">My Group</a></li>
                    <li><a href="supervisor.html">My Supervisor</a></li>
                    <li><a href="assessments.html">My Assessments</a></li>
                    <li><a href="notifications.html">Notifications</a></li>
                </ul>
            </nav>
        </aside>

        <main>
            <h2>Personal & Academic Details</h2>
            <form action="#" method="POST">
                <div>
                    <label for="full-name">Full Name:</label>
                    <input type="text" id="full-name" name="full-name" value="John Doe" readonly>
                </div>

                <div>
                    <label for="student-id">Student Registration ID:</label>
                    <input type="text" id="student-id" name="student-id" value="CS-2026-001" readonly>
                </div>

                <div>
                    <label for="program">Program:</label>
                    <input type="text" id="program" name="program" value="BSc Computer Science" readonly>
                </div>

                <div>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="+256 700 000000">
                </div>

                <div>
                    <button type="submit">Update Profile</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
